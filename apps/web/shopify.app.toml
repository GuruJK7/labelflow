# Configuración declarativa de la app de Shopify de AutoEnvía.
#
# Este archivo ES la app: en vez de completar quince campos a mano en el panel,
# la CLI de Shopify lee esto y lo aplica. Vos te autenticás una vez y corrés
# dos comandos; el resto ya está escrito acá.
#
#   npx shopify app config link      # elegís organización y creás la app
#   npx shopify app deploy           # sube esta configuración
#
# `client_id` es el de la app real ya creada (org LabelFlow SAS, app 417965080577).
# secreto (viaja en la URL de autorización). El Client SECRET no va nunca en
# este archivo: ese va como variable de entorno en Vercel.
#
# ── DISTRIBUCIÓN ─────────────────────────────────────────────────────────────
# El tipo de distribución NO se elige acá, se elige en el panel al crear la app,
# y NO SE PUEDE CAMBIAR DESPUÉS. Las dos opciones y qué implican:
#
#   custom  → se instala en UNA tienda (o varias de la misma organización Plus,
#             o tiendas de desarrollo). Sin revisión de Shopify. Sirve hoy mismo
#             para las marcas que ya operamos: un link de instalación por tienda.
#   public  → la instala cualquier tienda. REQUIERE aprobación de Shopify. Es la
#             única que habilita el self-serve real.
#
# Las seis apps que ya existen en la organización Quanam son todas custom, por
# eso ninguna sirve para el botón universal y hay que crear una nueva.

client_id = "a4231e6cc6a41a79e1b01aebf3dd38b5"
name = "AutoEnvía"
# 🔴 `handle` NO se declara acá. Es el identificador público de la app y ya está
# asignado del lado de Shopify; volver a declararlo hace que `app deploy` falle
# con «app_handle: App handle must be unique» y NINGUNA otra parte de la
# configuración llega a subirse — incluidos los webhooks de cumplimiento, que
# son obligatorios para la revisión del App Store.
application_url = "https://autoenvia.com/api/shopify/entry"

# No es una app embebida: el comerciante vive en NUESTRO dashboard, va a Shopify
# sólo a autorizar y vuelve. No renderizamos nada dentro del admin de Shopify.
# (Si algún día se busca listarla en el App Store, Shopify empuja fuerte hacia
# embedded=true; es una conversación de diseño, no un cambio de una línea.)
embedded = false

[access_scopes]
# Los mismos diez de REQUIRED_SCOPES en apps/web/lib/shopify-oauth.ts.
# Si cambian allá, cambian acá: hay un test que falla si se desincronizan.
#
#   read_orders / write_orders            → leer pedidos pagos, escribir notas y tags
#   read_fulfillments / write_fulfillments → marcar el pedido como enviado
#   read_products / write_products         → resolver SKU y tipo de producto
#   *_fulfillment_orders                   → API moderna de fulfillment; sin estos,
#                                            marcar como enviado falla en tiendas nuevas
scopes = "read_orders,write_orders,read_fulfillments,write_fulfillments,read_products,write_products,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

# Token offline: el worker despacha a las 3 de la mañana sin nadie logueado.
# Un token online expira con la sesión del comerciante y rompería el cron.
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://autoenvia.com/api/shopify/callback",
]

[webhooks]
# Suscripciones de webhooks: NO se declaran acá a propósito. Las registra la app
# por tienda con webhookSubscriptionCreate en el callback/claim (lib/shopify-register-webhooks.ts),
# porque `webhookSubscriptions` no ve las app-scoped del TOML y declararlas en los dos
# lados entregaría cada pedido dos veces (revisión de feat/shopify-graphql, 2026-09-01).
api_version = "2026-07"

  # Pedido pago → encolar al instante en vez de esperar al cron de 15 minutos.

  # Desinstalación → limpiar el token. Sin esto queda un token muerto y el cron
  # encolando trabajos que nunca van a servir.

  # 🔴 LOS DE CUMPLIMIENTO SÍ VAN ACÁ, y en ESTE formato.
  #
  # Son app-scoped: Shopify los llama sin que exista una tienda instalada, así
  # que no se pueden registrar por tienda como los otros. Y son obligatorios
  # para cualquier app del App Store.
  #
  # El bloque `[webhooks.privacy_compliance]` con `customer_data_request_url`
  # está DEPRECADO. La CLI lo acepta sin chistar y no registra nada: la app
  # queda sin webhooks de cumplimiento y la comprobación automática de Shopify
  # falla con «Error en el webhook», sin decir por qué. Verificado contra la
  # doc de configuración de la app el 2026-09-03.
  #
  # Va SIN `topics`: acá se declaran únicamente los de cumplimiento. Sumar
  # `orders/paid` o `app/uninstalled` a este bloque los entregaría dos veces,
  # porque esos ya se registran por tienda en el callback.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://autoenvia.com/api/webhooks/shopify/gdpr"

[pos]
embedded = false

[build]
